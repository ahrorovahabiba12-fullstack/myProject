server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Client-side routes (/dashboard, /quiz, ...) aren't files on disk — serve
  # the SPA shell and let React Router resolve them, so a refresh or a pasted
  # link never 404s.
  location / {
    try_files $uri /index.html;
  }

  # Vite fingerprints everything under /assets, so those can be cached for
  # good; index.html must never be, or a new deploy keeps serving old bundles.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
